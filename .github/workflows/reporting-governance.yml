name: Reporting governance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the coverage measurement tool
        run: python -m pip install --disable-pip-version-check "coverage==7.16.0"
      - name: Check reports and generated indexes
        run: |
          python scripts/devguide_index.py --check
          python -m coverage run --branch --source=scripts -m unittest discover -s tests -p test_reporting_protocol.py
          python -m coverage xml -o coverage.xml
      - name: Retain measured governance coverage
        uses: actions/upload-artifact@v4
        with:
          name: governance-coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  coverage-upload:
    name: Publish umbrella governance coverage
    needs: reporting
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'uibcdf/molsys-ai'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: governance-coverage-xml
          path: coverage-report
      - name: Upload the measured report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-report/coverage.xml
          disable_search: true
          fail_ci_if_error: true
